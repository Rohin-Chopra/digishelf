name: digishelf-app
description: Digishelf, TanStack Start SSR and Go GraphQL Lambdas behind CloudFront
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
    # Node runs the .ts files directly (type stripping), so no ts-node.
    typescript: false
main: index.ts
config:
  aws:region: ap-southeast-4
  digishelf-app:hostedZone: rohinchopra.com
